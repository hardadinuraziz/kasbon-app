<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KasbonKu — Buku Catatan Kasbon</title>
  <meta name="description" content="Buku catatan kasbon digital minimalis: catat piutang, cicilan, tagih WhatsApp, dan nota PNG secara offline.">
  <meta name="theme-color" content="#F3EFE6">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- Ambient Paper & Soft Light Backdrop -->
  <div class="ambient-scene" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="paper-rules"></div>
  </div>

  <!-- Floating Glass Top Navigation Bar -->
  <header class="top-dock-wrap">
    <div class="top-dock glass-panel">
      <div class="dock-brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-title">KasbonKu</span>
        <span class="brand-sep" aria-hidden="true">/</span>
        <span class="brand-biz" id="dockBusinessName">Buku Catatan</span>
      </div>

      <nav class="dock-tabs" aria-label="Navigasi">
        <button type="button" class="dock-tab active" data-view="beranda">
          Kasbon <span class="tab-badge mono" id="navActiveCount">0</span>
        </button>
        <button type="button" class="dock-tab" data-view="kontak">
          Nama <span class="tab-badge mono" id="navContactCount">0</span>
        </button>
        <button type="button" class="dock-tab" data-view="mutasi">Mutasi</button>
        <button type="button" class="dock-tab" data-view="laporan">Laporan</button>
      </nav>

      <div class="dock-actions">
        <button type="button" class="icon-glass-btn" id="themeToggleBtn" aria-label="Ganti Tema" title="Ganti Tema"></button>
        <button type="button" class="icon-glass-btn" id="settingsOpenBtn" aria-label="Profil" title="Profil &amp; Rekening">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button type="button" class="btn-ink dock-add-btn" id="topNewKasbonBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>Catat</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Centered Notebook Column -->
  <main class="notebook-stage">
    <div class="notebook-column" id="appRoot">
      <!-- Rendered dynamically by js/app.js -->
    </div>
  </main>

  <!-- Mobile Floating Glass Bottom Dock -->
  <nav class="mobile-dock-wrap" aria-label="Navigasi Mobile">
    <div class="mobile-dock glass-panel">
      <button type="button" class="m-tab active" data-view="beranda" aria-label="Kasbon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span>Kasbon</span>
      </button>
      <button type="button" class="m-tab" data-view="kontak" aria-label="Nama">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
        </svg>
        <span>Nama</span>
      </button>
      <button type="button" class="m-add-fab" id="mobileNewKasbonBtn" aria-label="Catat Kasbon Baru" title="Catat Kasbon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button type="button" class="m-tab" data-view="mutasi" aria-label="Mutasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 16V4m0 0-3 3m3-3 3 3"/>
          <path d="M17 8v12m0 0 3-3m-3 3-3-3"/>
        </svg>
        <span>Mutasi</span>
      </button>
      <button type="button" class="m-tab" data-view="laporan" aria-label="Laporan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 20V10M12 20V4M6 20v-6"/>
        </svg>
        <span>Laporan</span>
      </button>
    </div>
  </nav>

  <!-- ======================================================================
       MODALS (Frosted Glass Sheets)
       ====================================================================== -->

  <!-- 1. Catat / Edit Kasbon -->
  <div class="modal-backdrop" id="kasbonModal" role="dialog" aria-modal="true" aria-labelledby="kasbonModalTitle">
    <div class="modal-sheet glass-modal">
      <div class="modal-head">
        <h2 class="modal-title" id="kasbonModalTitle">Catat Kasbon</h2>
        <button type="button" class="icon-glass-btn" data-close-modal="kasbonModal" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="kasbonForm" novalidate>
        <div class="modal-body">
          <input type="hidden" id="kbEditId">

          <div class="field-row">
            <div class="field">
              <label for="kbBorrowerName">Nama</label>
              <input type="text" id="kbBorrowerName" class="input-glass" list="borrowerSuggestions" placeholder="Budi Santoso" required autocomplete="off">
              <datalist id="borrowerSuggestions"></datalist>
            </div>
            <div class="field">
              <label for="kbPhone">WhatsApp</label>
              <input type="tel" id="kbPhone" class="input-glass mono" placeholder="0812xxxx">
            </div>
          </div>

          <div class="field">
            <label for="kbAmount">Nominal</label>
            <div class="amount-box">
              <span class="amount-rp">Rp</span>
              <input type="text" id="kbAmount" class="input-glass amount-input mono" inputmode="numeric" placeholder="0" required autocomplete="off">
            </div>
            <div class="chip-row">
              <button type="button" class="chip-btn" data-add-amount="50000">+50rb</button>
              <button type="button" class="chip-btn" data-add-amount="100000">+100rb</button>
              <button type="button" class="chip-btn" data-add-amount="250000">+250rb</button>
              <button type="button" class="chip-btn" data-add-amount="500000">+500rb</button>
              <button type="button" class="chip-btn" data-add-amount="1000000">+1jt</button>
            </div>
          </div>

          <div class="field">
            <label for="kbDescription">Keperluan</label>
            <input type="text" id="kbDescription" class="input-glass" placeholder="Kasbon gaji, sembako, operasional..." required>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="kbCategory">Kategori</label>
              <select id="kbCategory" class="input-glass">
                <option value="karyawan">Karyawan</option>
                <option value="pelanggan">Pelanggan</option>
                <option value="teman">Teman</option>
                <option value="operasional">Operasional</option>
              </select>
            </div>
            <div class="field">
              <label for="kbDate">Tanggal</label>
              <input type="date" id="kbDate" class="input-glass mono" required>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="kbDueDate">Jatuh Tempo</label>
              <input type="date" id="kbDueDate" class="input-glass mono">
            </div>
            <div class="field">
              <label for="kbNotes">Catatan</label>
              <input type="text" id="kbNotes" class="input-glass" placeholder="Opsional">
            </div>
          </div>

          <div class="form-error" id="kbFormError" role="alert"></div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn-glass" data-close-modal="kasbonModal">Batal</button>
          <button type="submit" class="btn-ink" id="kbSubmitBtn">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Bayar / Cicil -->
  <div class="modal-backdrop" id="paymentModal" role="dialog" aria-modal="true" aria-labelledby="paymentModalTitle">
    <div class="modal-sheet glass-modal">
      <div class="modal-head">
        <h2 class="modal-title" id="paymentModalTitle">Bayar / Cicil</h2>
        <button type="button" class="icon-glass-btn" data-close-modal="paymentModal" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="paymentForm" novalidate>
        <div class="modal-body">
          <input type="hidden" id="payRecordId">
          <div class="mini-ledger-box" id="paySummaryCallout"></div>

          <div class="field">
            <label for="payAmount">Nominal Bayar</label>
            <div class="amount-box">
              <span class="amount-rp">Rp</span>
              <input type="text" id="payAmount" class="input-glass amount-input mono" inputmode="numeric" placeholder="0" required autocomplete="off">
            </div>
            <div class="chip-row" id="payQuickChips"></div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="payDate">Tanggal</label>
              <input type="date" id="payDate" class="input-glass mono" required>
            </div>
            <div class="field">
              <label for="payMethod">Metode</label>
              <select id="payMethod" class="input-glass">
                <option value="Tunai">Tunai</option>
                <option value="Transfer Bank">Transfer Bank</option>
                <option value="QRIS / E-Wallet">QRIS / E-Wallet</option>
                <option value="Potong Gaji">Potong Gaji</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="payNote">Catatan</label>
            <input type="text" id="payNote" class="input-glass" placeholder="Opsional">
          </div>

          <div class="form-error" id="payFormError" role="alert"></div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn-glass" data-close-modal="paymentModal">Batal</button>
          <button type="submit" class="btn-ink">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. Detail & Riwayat Cicilan -->
  <div class="modal-backdrop" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
    <div class="modal-sheet glass-modal wide">
      <div class="modal-head">
        <h2 class="modal-title" id="detailModalTitle">Detail</h2>
        <button type="button" class="icon-glass-btn" data-close-modal="detailModal" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="detailModalBody"></div>
      <div class="modal-foot" id="detailModalFooter"></div>
    </div>
  </div>

  <!-- 4. WhatsApp -->
  <div class="modal-backdrop" id="waModal" role="dialog" aria-modal="true" aria-labelledby="waModalTitle">
    <div class="modal-sheet glass-modal">
      <div class="modal-head">
        <h2 class="modal-title" id="waModalTitle">Tagih WhatsApp</h2>
        <button type="button" class="icon-glass-btn" data-close-modal="waModal" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="seg-control" id="waToneGroup">
          <button type="button" class="seg-btn active" data-wa-tone="sopan">Sopan</button>
          <button type="button" class="seg-btn" data-wa-tone="formal">Formal</button>
          <button type="button" class="seg-btn" data-wa-tone="santai">Santai</button>
        </div>
        <div class="field">
          <label for="waPhoneInput">Nomor</label>
          <input type="tel" id="waPhoneInput" class="input-glass mono" placeholder="0812xxxx">
        </div>
        <div class="field">
          <label for="waMessagePreview">Pesan</label>
          <textarea id="waMessagePreview" class="input-glass" rows="7"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn-glass" id="waCopyBtn">Salin</button>
        <button type="button" class="btn-wa" id="waSendBtn">Kirim WA</button>
      </div>
    </div>
  </div>

  <!-- 5. Nota Digital PNG -->
  <div class="modal-backdrop" id="receiptModal" role="dialog" aria-modal="true" aria-labelledby="receiptModalTitle">
    <div class="modal-sheet glass-modal">
      <div class="modal-head">
        <h2 class="modal-title" id="receiptModalTitle">Nota Digital</h2>
        <button type="button" class="icon-glass-btn" data-close-modal="receiptModal" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="receipt-stage">
          <canvas id="receiptCanvas" aria-label="Nota Digital"></canvas>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn-glass" data-close-modal="receiptModal">Tutup</button>
        <button type="button" class="btn-ink" id="downloadReceiptBtn">Unduh PNG</button>
      </div>
    </div>
  </div>

  <!-- 6. Profil Usaha -->
  <div class="modal-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal-sheet glass-modal">
      <div class="modal-head">
        <h2 class="modal-title" id="settingsModalTitle">Profil Buku</h2>
        <button type="button" class="icon-glass-btn" data-close-modal="settingsModal" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="settingsForm">
        <div class="modal-body">
          <div class="field">
            <label for="setBusinessName">Nama Usaha / Pemilik</label>
            <input type="text" id="setBusinessName" class="input-glass" placeholder="Warung Berkah">
          </div>
          <div class="field">
            <label for="setPaymentInfo">Rekening / E-Wallet</label>
            <textarea id="setPaymentInfo" class="input-glass" rows="4" placeholder="BCA 1234567890 a.n. Nama&#10;DANA / GoPay: 0812-xxxx-xxxx"></textarea>
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn-glass" data-close-modal="settingsModal">Batal</button>
          <button type="submit" class="btn-ink">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 7. Konfirmasi -->
  <div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
    <div class="modal-sheet glass-modal compact">
      <div class="modal-head">
        <h2 class="modal-title" id="confirmModalTitle">Konfirmasi</h2>
        <button type="button" class="icon-glass-btn" data-close-modal="confirmModal" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p id="confirmModalMessage" class="confirm-text"></p>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn-glass" data-close-modal="confirmModal">Batal</button>
        <button type="button" class="btn-danger" id="confirmModalOkBtn">Lanjutkan</button>
      </div>
    </div>
  </div>

  <input type="file" id="jsonImportInput" accept="application/json,.json" class="sr-only">
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script defer src="./js/utils.js"></script>
  <script defer src="./js/storage.js"></script>
  <script defer src="./js/receipt.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
